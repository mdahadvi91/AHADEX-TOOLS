<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1114" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FDF8F3" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <title>AHADEX Tools — 42 Free & Private Online Tools</title>
    <meta
      name="description"
      content="42 free, fast and private online tools for image, PDF, QR, text, developer and calculator tasks. All processing runs in your browser — no uploads, no accounts."
    />
    <meta name="author" content="AHADEX" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://ahadex.fun/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AHADEX Tools" />
    <meta property="og:title" content="AHADEX Tools — 42 Free & Private Online Tools" />
    <meta property="og:description" content="42 free online tools. All in your browser. No uploads. No sign-up." />
    <meta property="og:url" content="https://ahadex.fun/" />
    <meta property="og:image" content="https://ahadex.fun/images/og/default-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AHADEX Tools — 42 Free & Private Online Tools" />
    <meta name="twitter:description" content="42 free online tools. All in your browser." />
    <meta name="twitter:image" content="https://ahadex.fun/images/og/default-og.jpg" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Dancing+Script:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ahadex-theme");
          var theme = stored || "system";
          var isDark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.classList.toggle("light", !isDark);
          document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui; text-align: center;">
        <h1>AHADEX Tools</h1>
        <p>Please enable JavaScript to use AHADEX Tools.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
