<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1114" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FDF8F3" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <title>AHADEX Tools — Free, Fast, Private Online Tools</title>
    <meta name="description" content="A growing collection of carefully crafted online tools for everyday digital tasks." />
    <meta name="author" content="AHADEX" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://ahadex.fun/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=general-sans@400,500,600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ahadex-theme");
          var theme = stored || "system";
          var isDark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.classList.toggle("light", !isDark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui; text-align: center;">
        <h1>AHADEX Tools</h1>
        <p>Please enable JavaScript to use AHADEX Tools.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
