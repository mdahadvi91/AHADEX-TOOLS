    <!-- Google Consent Mode v2 — required BEFORE gtag.js and AdSense load -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("consent", "default", {
        ad_storage: "denied",

  <body>

      style="position:absolute;left:-9999px;top:0;z-index:9999;padding:12px 20px;background:#8B3A4F;color:#fff;text-decoration:none;border-radius:0 0 8px 0;font-family:system-ui,sans-serif;font-size:14px;font-weight:600;"

    >Skip to main content</a>
