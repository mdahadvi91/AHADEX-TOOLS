      rel="stylesheet"
    />

    <!-- Theme + language bootstrap (prevents FOUC) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ahadex-theme");
          var theme = stored || "system";
          var isDark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.classList.toggle("light", !isDark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();

      (function () {
        try {
          var stored = localStorage.getItem("ahadex-language");
          var browserLang = (navigator.language || "en").slice(0, 2);
          var lang =
            stored ||
            (["en", "bn"].includes(browserLang) ? browserLang : "en");
          document.documentElement.setAttribute("lang", lang);
          document.documentElement.setAttribute("dir", "ltr");
        } catch (e) {
          document.documentElement.setAttribute("lang", "en");
          document.documentElement.setAttribute("dir", "ltr");
        }
      })();
    </script>

    <!-- Google Consent Mode v2 — default denied (required before gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        personalization_storage: "denied",
        functionality_storage: "granted",
        security_storage: "granted",
        wait_for_update: 500
      });
      gtag("set", "ads_data_redaction", true);
      gtag("set", "url_passthrough", true);
    </script>

    <!-- Google tag (gtag.js) — loaded statically so Google scanner detects it -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NJB6S9E9N3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-NJB6S9E9N3", {
        send_page_view: false,
        anonymize_ip: true
      });
    </script>
