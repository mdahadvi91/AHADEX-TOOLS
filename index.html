<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#1A1114" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FDF8F3" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- SEO defaults (React overrides on route change) -->
    <title>AHADEX Tools — Free, Fast, Private Online Tools</title>
    <meta
      name="description"
      content="Free, fast and private online tools for everyday digital tasks. Everything runs in your browser."
    />
    <meta name="author" content="AHADEX" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="canonical" href="https://ahadex.fun/" />

    <!-- AdSense meta (uncomment after approval) -->
    <!-- <meta name="google-adsense-account" content="ca-pub-XXXXXXXXXXXXXXXX" /> -->

    <!-- Preconnect — single set only -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />

    <!-- Primary fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Script / decorative -->
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bengali -->
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Baloo+Da+2:wght@400;500;600;700;800&family=Noto+Serif+Bengali:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme + language bootstrap (prevents FOUC) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ahadex-theme");
          var theme = stored || "system";
          var isDark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.classList.toggle("light", !isDark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();

      (function () {
        try {
          var stored = localStorage.getItem("ahadex-language");
          var browserLang = (navigator.language || "en").slice(0, 2);
          var lang =
            stored ||
            (["en", "bn"].includes(browserLang) ? browserLang : "en");
          document.documentElement.setAttribute("lang", lang);
          document.documentElement.setAttribute("dir", "ltr");
        } catch (e) {
          document.documentElement.setAttribute("lang", "en");
          document.documentElement.setAttribute("dir", "ltr");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui; text-align: center;">
        <h1>AHADEX Tools</h1>
        <p>Please enable JavaScript to use AHADEX Tools.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
