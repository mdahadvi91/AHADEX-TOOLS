<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#1A1114"/>
        <stop offset="100%" stop-color="#32202A"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#D88B9A"/>
        <stop offset="50%" stop-color="#8B3A4F"/>
        <stop offset="100%" stop-color="#C99667"/>
      </linearGradient>
      <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.6">
        <stop offset="0%" stop-color="#D88B9A" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#D88B9A" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glow2" cx="0.9" cy="0.85" r="0.7">
        <stop offset="0%" stop-color="#C99667" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#C99667" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#glow1)"/>
    <rect width="1200" height="630" fill="url(#glow2)"/>

    <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
    <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>

    <!-- Category badge -->
    <rect x="100" y="80" width="98" height="46" rx="23" fill="#D88B9A" opacity="0.15" stroke="#D88B9A" stroke-width="1.5"/>
    <text x="149" y="110" text-anchor="middle" font-family="'Noto Sans','Droid Sans',system-ui,sans-serif" font-size="20" font-weight="600" fill="#E8B4B8" letter-spacing="0.5">DESIGN</text>

    <!-- Emoji decoration (top right) -->
    <text x="1080" y="130" text-anchor="middle" font-family="'Noto Color Emoji','Noto Sans',sans-serif" font-size="72" opacity="0.85">⭐</text>

    <!-- Title (line 1) -->
    <text x="100" y="230" font-family="'Noto Sans','Droid Sans',system-ui,sans-serif" font-size="46" font-weight="800" fill="#F8F6F1" letter-spacing="-2">How to Create a Favicon</text>
    <!-- Title (line 2) -->
    <text x="100" y="288" font-family="'Noto Sans','Droid Sans',system-ui,sans-serif" font-size="46" font-weight="800" fill="#F8F6F1" letter-spacing="-2">From Your Logo (Step-by-Step)</text>

    <!-- Excerpt -->
    <text x="100" y="450" font-family="'Noto Sans','Droid Sans',system-ui,sans-serif" font-size="24" font-weight="400" fill="#C4A89E" letter-spacing="-0.3">Your favicon is your logo at 16 pixels. Most logos do not survive at that size. Learn how to design a favicon…</text>

    <!-- Meta pills -->
    <g transform="translate(100, 520)">
      <rect x="0" y="0" width="220" height="52" rx="26" fill="#FFFFFF" opacity="0.06" stroke="#D88B9A" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="5" fill="#D88B9A"/>
      <text x="46" y="34" font-family="'Noto Sans','Droid Sans',sans-serif" font-size="18" font-weight="500" fill="#F8F6F1">6 min read</text>

      <rect x="240" y="0" width="260" height="52" rx="26" fill="#FFFFFF" opacity="0.06" stroke="#C99667" stroke-width="1.5"/>
      <circle cx="268" cy="26" r="5" fill="#C99667"/>
      <text x="286" y="34" font-family="'Noto Sans','Droid Sans',sans-serif" font-size="18" font-weight="500" fill="#F8F6F1">AHADEX Blog</text>
    </g>

    <!-- Domain -->
    <text x="100" y="610" font-family="'Noto Sans Mono','Droid Sans Mono',monospace" font-size="22" font-weight="500" fill="#D88B9A" letter-spacing="0.5" opacity="0.85">ahadex.fun/blog</text>
  </svg>
  